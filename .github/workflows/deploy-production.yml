name: Deploy production

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

      - name: Build backend
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../artifact/backend
          go build -trimpath -ldflags='-s -w' -o ../artifact/backend/tarot-app .

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run lint
          npm test
          npm run build
          mkdir -p ../artifact/frontend
          cp -R dist/. ../artifact/frontend/

      - name: Package release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="tarot-app-${GITHUB_SHA}.tar.gz"
          tar -C artifact -czf "$archive" .
          sha256sum "$archive" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: tarot-app-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          scp -P "$VPS_PORT" "$ARCHIVE" "${ARCHIVE}.sha256" \
            "${VPS_USER}@${VPS_HOST}:/tmp/"

      - name: Install release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" \
            "sudo /usr/local/sbin/install-tarot-release '${GITHUB_SHA}' '/tmp/${ARCHIVE}' '/tmp/${ARCHIVE}.sha256'"
